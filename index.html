<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoGeral - O Mundo dos Vídeos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen pb-16 md:pb-0">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="#" class="text-xl font-black tracking-wider text-red-600">VIDEO<span class="text-white">GERAL</span></a>
        </div>
        <div class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-300">
            <a href="#" class="text-white border-b-2 border-red-600 pb-1">Início</a>
            <a href="#" class="hover:text-white transition">Filmes</a>
            <a href="#" class="hover:text-white transition">Comédia</a>
            <a href="#" class="hover:text-white transition">Dramas</a>
            <a href="#" class="hover:text-white transition">Mais Curtidos</a>
        </div>
        <div class="flex items-center space-x-3">
            <button class="w-9 h-9 bg-slate-800 hover:bg-slate-700 rounded-full flex items-center justify-center text-slate-300 transition">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <a href="admin.html" class="w-9 h-9 bg-red-600 hover:bg-red-500 rounded-full flex items-center justify-center text-white transition" title="Painel Admin">
                <i class="fa-solid fa-user"></i>
            </a>
        </div>
    </header>

    <!-- Sub-Categories Bar -->
    <nav class="flex space-x-2 px-4 py-3 overflow-x-auto bg-slate-900/50 border-b border-slate-900 whitespace-nowrap scrollbar-none">
        <button class="px-4 py-1.5 bg-red-600 text-white rounded-full text-xs font-semibold shadow-md flex items-center"><i class="fa-solid fa-border-all mr-1.5"></i> Todos</button>
        <button class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full text-xs font-semibold transition flex items-center"><i class="fa-solid fa-face-laugh-beam mr-1.5"></i> Comédia</button>
        <button class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full text-xs font-semibold transition flex items-center"><i class="fa-solid fa-fire mr-1.5"></i> Mini-Dramas</button>
        <button class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full text-xs font-semibold transition flex items-center"><i class="fa-solid fa-music mr-1.5"></i> Música</button>
        <button class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full text-xs font-semibold transition flex items-center"><i class="fa-solid fa-bolt mr-1.5"></i> Desafios</button>
        <button class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full text-xs font-semibold transition flex items-center"><i class="fa-solid fa-gamepad mr-1.5"></i> Games</button>
        <button class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full text-xs font-semibold transition flex items-center"><i class="fa-solid fa-lightbulb mr-1.5"></i> Curiosidades</button>
        <button class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full text-xs font-semibold transition flex items-center"><i class="fa-solid fa-film mr-1.5"></i> Filmes</button>
        <button class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full text-xs font-semibold transition flex items-center"><i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i> Dicas</button>
        <button class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full text-xs font-semibold transition flex items-center"><i class="fa-solid fa-star mr-1.5"></i> Fofoca</button>
        <button class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full text-xs font-semibold transition flex items-center"><i class="fa-solid fa-futbol mr-1.5"></i> Esportes</button>
    </nav>

    <!-- Main Content Container -->
    <main id="public-content" class="max-w-7xl mx-auto px-4 py-6 space-y-12">
        <div class="text-center py-12 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-2xl text-red-600 mb-2"></i>
            <p>Carregando vídeos do banco de dados...</p>
        </div>
    </main>

    <!-- Modal do Player de Vídeo -->
    <div id="video-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="relative w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
            <button onclick="fecharModal()" class="absolute top-3 right-3 z-10 w-10 h-10 bg-black/60 hover:bg-red-600 text-white rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="aspect-video bg-black flex items-center justify-center">
                <video id="modal-video-player" controls autoplay class="w-full h-full object-contain"></video>
            </div>
            <div class="p-4 bg-slate-900">
                <h2 id="modal-title" class="text-base font-bold text-white"></h2>
                <p id="modal-info" class="text-xs text-slate-400 mt-1"></p>
            </div>
        </div>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 w-full z-50 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 flex justify-around items-center py-2 text-slate-400 md:hidden">
        <a href="#" class="flex flex-col items-center text-red-500">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] mt-1 font-medium">Início</span>
        </a>
        <a href="#" class="flex flex-col items-center hover:text-white transition">
            <i class="fa-solid fa-film text-base"></i>
            <span class="text-[10px] mt-1 font-medium">Filmes</span>
        </a>
        <a href="admin.html" class="flex flex-col items-center text-white">
            <div class="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center text-white text-sm shadow-lg shadow-red-600/30">
                <i class="fa-solid fa-plus"></i>
            </div>
        </a>
        <a href="#" class="flex flex-col items-center hover:text-white transition">
            <i class="fa-solid fa-face-laugh-beam text-base"></i>
            <span class="text-[10px] mt-1 font-medium">Comédia</span>
        </a>
        <a href="#" class="flex flex-col items-center hover:text-white transition">
            <i class="fa-solid fa-user text-base"></i>
            <span class="text-[10px] mt-1 font-medium">Perfil</span>
        </a>
    </nav>

    <script>
        const SUPABASE_URL = 'SUA_SUPABASE_URL_AQUI'; // Ex: https://xyzabc.supabase.co
        const SUPABASE_KEY = 'sb_publishable_FNy8BJLIdTEyWPRBxfb9hg_gisFcT7d';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarVideosPublicos() {
            try {
                const { data: videos, error } = await _supabase
                    .from('videos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const container = document.getElementById('public-content');
                if (!videos || videos.length === 0) {
                    container.innerHTML = '<p class="text-center text-slate-400 py-12">Nenhum vídeo cadastrado no momento. Use o painel administrativo para enviar conteúdo.</p>';
                    return;
                }

                container.innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                        ${videos.map(video => `
                            <div onclick="abrirVideo('${video.url}', '${video.title.replace(/'/g, "\\'")}', '${video.channel || 'VideoGeral'} • ${video.views || 0} visualizações')" class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden group cursor-pointer">
                                <div class="relative aspect-video bg-slate-950 flex items-center justify-center">
                                    <img src="${video.thumbnail}" alt="${video.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                    <div class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                        <div class="w-12 h-12 bg-red-600 rounded-full flex items-center text-white justify-center shadow-lg">
                                            <i class="fa-solid fa-play ml-1"></i>
                                        </div>
                                    </div>
                                    <span class="absolute bottom-2 right-2 bg-black/80 text-[10px] font-bold px-2 py-0.5 rounded text-white">${video.duration || '0:00'}</span>
                                </div>
                                <div class="p-4">
                                    <span class="text-[10px] font-bold text-red-500 uppercase tracking-wider">${video.category}</span>
                                    <h3 class="text-sm font-bold text-slate-100 group-hover:text-red-400 transition mt-1">${video.title}</h3>
                                    <p class="text-[11px] text-slate-400 mt-2">${video.channel || 'VideoGeral'} • ${video.views || 0} visualizações</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (err) {
                console.error('Erro ao buscar vídeos:', err.message);
            }
        }

        function abrirVideo(url, title, info) {
            const modal = document.getElementById('video-modal');
            const player = document.getElementById('modal-video-player');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-info').textContent = info;
            player.src = url;
            modal.classList.remove('hidden');
            player.play();
        }

        function fecharModal() {
            const modal = document.getElementById('video-modal');
            const player = document.getElementById('modal-video-player');
            player.pause();
            player.src = '';
            modal.classList.add('hidden');
        }

        carregarVideosPublicos();
    </script>
</body>
</html>
